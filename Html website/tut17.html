<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=">
    <title>COLORS CSS</title>
    <style>
        /* color by name */
        #firstpara{
            color: brown;
            background-color:yellow;
        }

       /* color by rgb value */
        #secondpara{
            font-size: 60px;
            color: rgb(0, 207, 193);
            background-color: chartreuse;
        }
     /* color by hex velue */
        #thirdpara{
            font-size: 80px;
            color: #455eb9;
            background-color: darkgoldenrod;
        }
    </style>
</head>
<body>
    <h2>This is my first box</h2>
    <P id="firstpara">This is a paragraph from first box</P>

    <h2>This is my first box</h2>
    <P id="secondpara">This is a paragraph from second box</P>

    <h2>This is my first box</h2>
    <P id="thirdpara">This is a paragraph from third box</P>
</body>
</html>
