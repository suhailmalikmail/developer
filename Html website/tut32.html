<!DOCTYPE html>
head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html lang="en">
<title>Attribute and nth child pseudo Selectors</title>
<style>
    .container {
        /* display: block; */
        width: 250px;
        margin: auto;
    }

    input {
        display: block;
        /* display: inline block; */

    }

    input[type='text'] {
        padding: 23px 35px;
        border: 4px solid red;
        margin: 12px;
    }

    a[target] {
        font-size: 50px;
        color: aqua;
    }

    a[target='_self'] {
        color: blue;
        font-size: 20px;
    }

    input[type=email] {
        color: yellow;
        border: 3px solid black;
        /* margin: 3px; */
    }

    /* This will apply css for third child  */
    /* li:nth-child(3) {
        color: rgb(65, 42, 165);
    }

     li:nth-child(2n+0) {
        color: rgb(165, 42, 77);
    } */
    li:nth-child(3n+3) {
        color: blue;
    }

    /* odd child */
    li:nth-child(odd) {
        background-color: cornflowerblue;
    }

    /* Even child */
    li:nth-child(even) {
        background-color: aqua;
    }
</style>
</head>

<body>
    <div class="container">
        <h1><a href="https://www.google.com/" target="_blank">Go to google</a></h1>
        <h1><a href="https://www.facebook.com/" target="_self">facebook</a></h1>
        <form action="" class="form-conterol">
            <input type="text" placeholder="Enter your name ">
            <input type="password" placeholder="Enter your password">
            <input type="email" placeholder="Enter your email">
            <input type="submit" value="submit">
        </form>
        <ul>
            <li class="item" id="item-1">Item1</li>
            <li class="item" id="item-2">Item2</li>
            <li class="item" id="item-3">Item3</li>
            <li class="item" id="item-4">Item4</li>
            <li class="item" id="item-5">Item5</li>
            <li class="item" id="item-6">Item6</li>
            <li class="item" id="item-7">Item7</li>
            <li class="item" id="item-8">Item8</li>
            <li class="item" id="item-9">Item9</li>
            <li class="item" id="item-10">Item10</li>
        </ul>
    </div>
</body>

</html>
