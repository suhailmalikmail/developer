<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height,width,borders,and background</title>
    <style>
        #firstpara{
            color: rgb(237, 100, 136);
            background-color: chartreuse;
            height: 80px;
            width: 500px;
            border-width: 10px;
            border-color:green;
            border-style:solid;
            border-radius: 30px;
        }

        #secondpara{
             color: rgb(237, 100, 136);
            background-color: rgb(0, 229, 255);
            height: 80px;
            width: 500px;
            border-top: 8px solid violet;
            border-right:8px solid black;
            border-left:8px solid blue ;
            border-bottom:8px solid red ;
            border-top-left-radius:5px ;
            border-top-right-radius:15px ;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius:25px ;
        }

        /* background-position center top left right bottom left right */
        #thirdpara {
    height: 300px;
    width: 500px;
    background-image: url('https://images.unsplash.com/photo-1546182990-dffeafbe841d');
    border:4px solid red;
    background-size: cover;
    background-position: center ;
}

    </style>
</head>
<body>
    <h2>This is a heading</h2>
    <p id="firstpara">This is a paragraph</p>

    <h2>This is a second heading</h2>
    <p id="secondpara">This is a second paragraph</p>

     <h2>This is a third heading</h2>
    <p id="thirdpara">This is a third paragraph</p>
</body>
</html>
