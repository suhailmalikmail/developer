<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and animations</title>
    <style>
        .container {
            /* display: flex; */
            background-color: blue;
        }

        .box {
            width: 250px;
            height: 250px;
            background-color: aqua;
            /* border: 6px solid palevioletred; */
            position: relative;
            /* animation-name: suhail1; */
            animation-duration: 1s;
            animation-iteration-count: 4;
            /* animation-fill-mode: alternate; */
            /* animation-timing-function: ease-out; */
            /* animation-delay:4s;  */
            /* animation-direction: reverse; */
        }

    
.box {
    position: relative;
    animation-name: suhail2;
    animation-duration: 4s;
    animation-iteration-count: infinite;
}

@keyframes suhail2 {
    0% {
        top: 0px;
        left: 0px;
    }

    25% {
        top: 250px;
        left: 0px;
    }

    75% {
        top: 250px;
        left: 250px;
    }

    100% {
        top: 0px;
        left: 250px;
    }
}


        @keyframes suhail1 {
            from {
                width: 200px;
            }

            to {
                width: 1200px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            This is a box
        </div>
    </div>
</body>

</html>
