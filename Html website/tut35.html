<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css variables/custom properties </title>
    <style>
        :root{
            --primary-color:blue;
            --danger-color:red;
            --maxw:250px;
        }
        .box {
            width: 300px;
            height: 300px;
            background-color: aqua;
            background-color: var(--primary-color);
            margin: 3px 8px;
            box-shadow: 5px 7px var(--box-color);
            border: 6px solid var(--danger-color);
        }
        .container {
            /* --box-color:blue; */
            max-width: var(--maxw);
            margin: auto;
            display: flex;
            /* background-color: var(--box-color); */
            background-color: var(--danger-color);
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
