<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .navbar {
            background-color: palevioletred;
            border-radius: 40px;
        }

        .navbar ul {
            overflow: auto;
        }

        .navbar li {
            float: left;
            list-style: none;
            margin: 10px 10px;
            padding-top: 23px;
        }

        .navbar li a {
            padding: 10px 10px;
            text-decoration: none;
            color: yellow;
        }
        .navbar li a:hover{
        background-color: black;
        }
        
        .search{
            float: right;
            color:rgb(122, 88, 198);
            padding: 25px 20px;
        }
                .navbar input{
            border-radius: 30px;
            padding: 10px 15px;
            width: 70%;
        }
        input{
            color: blue;
            border: 6px solid black;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="#">home</a></li>
                <li><a href="#">about</a></li>
                <li><a href="#">services</a></li>
                <li><a href="#">contact us</a></li>
                <div class="search">
             <input type="text" name="search" id="search" placeholder="search this website">
               </div>
            </ul>
       </nav>
    </header>
</body>

</html>
