<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Elements selectors */
        p{
            border: 10px solid blue;
        }
        /* Id selectors */
        #firstpara {
            color: red
        }

        #firstpara {
            background-color: yellow;
        }

        /* Class selectors */
        .bgyellow {
            background-color: yellow;
        }

        /* Gropuing selectors */
        footer,span{
            background-color: purple;
        }
    </style>
</head>

<body>
    <h1>CSS Selectors</h1>
    <p id="firstpara">This is a simple paragraph to demonstrate css Selectors</p>
    <p class="redelement bgyellow">This is a simple anothar paragraph to demonstrate css Selectors</p>
    <div>

        <p>This is a yet simple paragraph inside div to demonstrate css Selectors</p>
         <span>This is a span </span>

    </div>
    <footer>This is a footer </footer>
</body>

</html>
